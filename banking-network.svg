<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">Banking infrastructure network</title>
<desc id="desc">Conceptual vector network connecting banking, payments, data, AI, risk, markets and tokenization.</desc>
<defs>

<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080B10"/><stop offset="1" stop-color="#111821"/></linearGradient>
<linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FF6B35"/><stop offset="1" stop-color="#FF9F43"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F5F7FA" stop-opacity=".12"/><stop offset=".5" stop-color="#F5F7FA" stop-opacity=".025"/><stop offset="1" stop-color="#FF6B35" stop-opacity=".09"/></linearGradient>
<radialGradient id="core"><stop stop-color="#FF9F43" stop-opacity=".9"/><stop offset=".25" stop-color="#FF6B35" stop-opacity=".35"/><stop offset="1" stop-color="#FF6B35" stop-opacity="0"/></radialGradient>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#8994A3" stroke-opacity=".08"/></pattern>
<style>
.orbit{transform-box:fill-box;transform-origin:center;animation:spin 32s linear infinite}
.orbit2{transform-box:fill-box;transform-origin:center;animation:spinR 44s linear infinite}
.pulse{animation:pulse 4.8s ease-in-out infinite}
.signal{stroke-dasharray:10 18;animation:flow 14s linear infinite}
.float{animation:float 9s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}} @keyframes spinR{to{transform:rotate(-360deg)}}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-280}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@media (prefers-reduced-motion:reduce){.orbit,.orbit2,.pulse,.signal,.float{animation:none!important}}
</style>

</defs>

<rect width="1200" height="500" rx="24" fill="url(#bg)"/><rect width="1200" height="500" rx="24" fill="url(#grid)"/>
<text x="60" y="64" fill="#F5F7FA" font-family="system-ui" font-size="28" font-weight="700">Banking infrastructure / emerging technology</text>
<text x="60" y="89" fill="#8994A3" font-family="system-ui" font-size="12">A conceptual map, not a claim about any specific institution.</text>
<g stroke="#FF6B35" stroke-opacity=".35" fill="none">
<path class="signal" d="M150 210 C300 130 400 130 520 240 S800 350 1050 210"/>
<path class="signal" d="M150 350 C300 430 430 350 520 260 S800 130 1050 350"/>
</g>
<g class="pulse"><rect x="100" y="194" width="100" height="32" rx="4" fill="url(#glass)" stroke="#FF6B35" stroke-opacity=".4"/><text x="150" y="214" text-anchor="middle" fill="#F5F7FA" font-family="ui-monospace" font-size="10">BANK</text></g><g class="pulse"><rect x="300" y="129" width="100" height="32" rx="4" fill="url(#glass)" stroke="#FF6B35" stroke-opacity=".4"/><text x="350" y="149" text-anchor="middle" fill="#F5F7FA" font-family="ui-monospace" font-size="10">PAYMENT</text></g><g class="pulse"><rect x="470" y="224" width="100" height="32" rx="4" fill="url(#glass)" stroke="#FF6B35" stroke-opacity=".4"/><text x="520" y="244" text-anchor="middle" fill="#F5F7FA" font-family="ui-monospace" font-size="10">DATA</text></g><g class="pulse"><rect x="650" y="144" width="100" height="32" rx="4" fill="url(#glass)" stroke="#FF6B35" stroke-opacity=".4"/><text x="700" y="164" text-anchor="middle" fill="#F5F7FA" font-family="ui-monospace" font-size="10">AI</text></g><g class="pulse"><rect x="800" y="314" width="100" height="32" rx="4" fill="url(#glass)" stroke="#FF6B35" stroke-opacity=".4"/><text x="850" y="334" text-anchor="middle" fill="#F5F7FA" font-family="ui-monospace" font-size="10">RISK</text></g><g class="pulse"><rect x="1000" y="194" width="130" height="32" rx="4" fill="url(#glass)" stroke="#FF6B35" stroke-opacity=".4"/><text x="1050" y="214" text-anchor="middle" fill="#F5F7FA" font-family="ui-monospace" font-size="10">TOKENIZATION</text></g><g class="pulse"><rect x="100" y="334" width="100" height="32" rx="4" fill="url(#glass)" stroke="#FF6B35" stroke-opacity=".4"/><text x="150" y="354" text-anchor="middle" fill="#F5F7FA" font-family="ui-monospace" font-size="10">CUSTOMER</text></g><g class="pulse"><rect x="300" y="374" width="100" height="32" rx="4" fill="url(#glass)" stroke="#FF6B35" stroke-opacity=".4"/><text x="350" y="394" text-anchor="middle" fill="#F5F7FA" font-family="ui-monospace" font-size="10">MARKETS</text></g><g class="pulse"><rect x="650" y="324" width="100" height="32" rx="4" fill="url(#glass)" stroke="#FF6B35" stroke-opacity=".4"/><text x="700" y="344" text-anchor="middle" fill="#F5F7FA" font-family="ui-monospace" font-size="10">LEDGER</text></g>
</svg>
