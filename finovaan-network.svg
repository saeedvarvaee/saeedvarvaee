<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">Finovaan network</title>
<desc id="desc">Visual representation of Finovaan as a financial education and professional networking initiative.</desc>
<defs>

<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080B10"/><stop offset="1" stop-color="#111821"/></linearGradient>
<linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FF6B35"/><stop offset="1" stop-color="#FF9F43"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F5F7FA" stop-opacity=".12"/><stop offset=".5" stop-color="#F5F7FA" stop-opacity=".025"/><stop offset="1" stop-color="#FF6B35" stop-opacity=".09"/></linearGradient>
<radialGradient id="core"><stop stop-color="#FF9F43" stop-opacity=".9"/><stop offset=".25" stop-color="#FF6B35" stop-opacity=".35"/><stop offset="1" stop-color="#FF6B35" stop-opacity="0"/></radialGradient>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#8994A3" stroke-opacity=".08"/></pattern>
<style>
.orbit{transform-box:fill-box;transform-origin:center;animation:spin 32s linear infinite}
.orbit2{transform-box:fill-box;transform-origin:center;animation:spinR 44s linear infinite}
.pulse{animation:pulse 4.8s ease-in-out infinite}
.signal{stroke-dasharray:10 18;animation:flow 14s linear infinite}
.float{animation:float 9s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}} @keyframes spinR{to{transform:rotate(-360deg)}}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-280}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@media (prefers-reduced-motion:reduce){.orbit,.orbit2,.pulse,.signal,.float{animation:none!important}}
</style>

</defs>

<rect width="1200" height="400" rx="24" fill="url(#bg)"/><rect width="1200" height="400" rx="24" fill="url(#grid)"/>
<circle cx="600" cy="205" r="62" fill="url(#core)" filter="url(#soft)" opacity=".7"/><circle cx="600" cy="205" r="34" fill="#080B10" stroke="#FF6B35" stroke-width="2"/>
<text x="600" y="209" text-anchor="middle" fill="#F5F7FA" font-family="system-ui" font-size="14" font-weight="700">FINOVAAN</text>
<g stroke="#FF6B35" stroke-opacity=".38" fill="none">
<path class="signal" d="M600 205L260 115M600 205L360 315M600 205L840 105M600 205L940 300"/>
</g>
<circle cx="260" cy="115" r="7" fill="#FF9F43"/><text x="275" y="119" fill="#F5F7FA" font-family="ui-monospace" font-size="10">FINANCIAL EDUCATION</text><circle cx="360" cy="315" r="7" fill="#FF9F43"/><text x="375" y="319" fill="#F5F7FA" font-family="ui-monospace" font-size="10">PRACTICAL LEARNING</text><circle cx="840" cy="105" r="7" fill="#FF9F43"/><text x="855" y="109" fill="#F5F7FA" font-family="ui-monospace" font-size="10">INDUSTRY NETWORKING</text><circle cx="940" cy="300" r="7" fill="#FF9F43"/><text x="955" y="304" fill="#F5F7FA" font-family="ui-monospace" font-size="10">UNIVERSITY ↔ INDUSTRY</text><text x="60" y="350" fill="#8994A3" font-family="system-ui" font-size="12">Entrepreneurial initiative • no official website represented here</text>
</svg>
