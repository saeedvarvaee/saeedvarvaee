<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Financial orbit</title>
<desc id="desc">A layered orbital map of banking, markets, payments, risk, fintech and data.</desc>
<defs>

<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080B10"/><stop offset="1" stop-color="#111821"/></linearGradient>
<linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FF6B35"/><stop offset="1" stop-color="#FF9F43"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F5F7FA" stop-opacity=".12"/><stop offset=".5" stop-color="#F5F7FA" stop-opacity=".025"/><stop offset="1" stop-color="#FF6B35" stop-opacity=".09"/></linearGradient>
<radialGradient id="core"><stop stop-color="#FF9F43" stop-opacity=".9"/><stop offset=".25" stop-color="#FF6B35" stop-opacity=".35"/><stop offset="1" stop-color="#FF6B35" stop-opacity="0"/></radialGradient>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#8994A3" stroke-opacity=".08"/></pattern>
<style>
.orbit{transform-box:fill-box;transform-origin:center;animation:spin 32s linear infinite}
.orbit2{transform-box:fill-box;transform-origin:center;animation:spinR 44s linear infinite}
.pulse{animation:pulse 4.8s ease-in-out infinite}
.signal{stroke-dasharray:10 18;animation:flow 14s linear infinite}
.float{animation:float 9s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}} @keyframes spinR{to{transform:rotate(-360deg)}}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-280}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@media (prefers-reduced-motion:reduce){.orbit,.orbit2,.pulse,.signal,.float{animation:none!important}}
</style>

</defs>

<rect width="1200" height="420" rx="24" fill="url(#bg)"/><rect width="1200" height="420" rx="24" fill="url(#grid)"/>
<circle cx="600" cy="210" r="76" fill="url(#core)" filter="url(#soft)" opacity=".65"/>
<circle cx="600" cy="210" r="42" fill="#080B10" stroke="#FF6B35" stroke-width="2"/>
<text x="600" y="205" text-anchor="middle" fill="#F5F7FA" font-family="system-ui" font-size="14" font-weight="700">FINANCIAL</text>
<text x="600" y="223" text-anchor="middle" fill="#8994A3" font-family="ui-monospace" font-size="10">SYSTEM</text>
<g class="orbit"><ellipse cx="600" cy="210" rx="330" ry="92" fill="none" stroke="#FF6B35" stroke-opacity=".5" stroke-width="2"/><ellipse cx="600" cy="210" rx="250" ry="145" transform="rotate(35 600 210)" fill="none" stroke="#8994A3" stroke-opacity=".35" stroke-dasharray="4 9"/><ellipse cx="600" cy="210" rx="170" ry="60" transform="rotate(-38 600 210)" fill="none" stroke="#FF9F43" stroke-opacity=".42"/></g>
<g class="orbit2"><ellipse cx="600" cy="210" rx="360" ry="130" transform="rotate(-20 600 210)" fill="none" stroke="#FF6B35" stroke-opacity=".2"/></g>
<g class="pulse"><circle cx="300" cy="125" r="5" fill="#FF9F43"/><circle cx="300" cy="125" r="18" fill="none" stroke="#FF6B35" stroke-opacity=".22"/><text x="314" y="129" fill="#F5F7FA" font-family="ui-monospace" font-size="11">BANKS</text></g><g class="pulse"><circle cx="870" cy="125" r="5" fill="#FF9F43"/><circle cx="870" cy="125" r="18" fill="none" stroke="#FF6B35" stroke-opacity=".22"/><text x="884" y="129" fill="#F5F7FA" font-family="ui-monospace" font-size="11">MARKETS</text></g><g class="pulse"><circle cx="940" cy="275" r="5" fill="#FF9F43"/><circle cx="940" cy="275" r="18" fill="none" stroke="#FF6B35" stroke-opacity=".22"/><text x="954" y="279" fill="#F5F7FA" font-family="ui-monospace" font-size="11">PAYMENTS</text></g><g class="pulse"><circle cx="740" cy="355" r="5" fill="#FF9F43"/><circle cx="740" cy="355" r="18" fill="none" stroke="#FF6B35" stroke-opacity=".22"/><text x="754" y="359" fill="#F5F7FA" font-family="ui-monospace" font-size="11">RISK</text></g><g class="pulse"><circle cx="380" cy="350" r="5" fill="#FF9F43"/><circle cx="380" cy="350" r="18" fill="none" stroke="#FF6B35" stroke-opacity=".22"/><text x="394" y="354" fill="#F5F7FA" font-family="ui-monospace" font-size="11">FINTECH</text></g><g class="pulse"><circle cx="250" cy="260" r="5" fill="#FF9F43"/><circle cx="250" cy="260" r="18" fill="none" stroke="#FF6B35" stroke-opacity=".22"/><text x="264" y="264" fill="#F5F7FA" font-family="ui-monospace" font-size="11">DATA</text></g>
</svg>
