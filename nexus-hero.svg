<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="650" viewBox="0 0 1600 650" role="img" aria-labelledby="title desc">
<title id="title">NEXUS financial intelligence core</title>
<desc id="desc">Original vector illustration representing interconnected banking, capital, systems thinking and emerging technology.</desc>
<defs>

<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080B10"/><stop offset="1" stop-color="#111821"/></linearGradient>
<linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FF6B35"/><stop offset="1" stop-color="#FF9F43"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F5F7FA" stop-opacity=".12"/><stop offset=".5" stop-color="#F5F7FA" stop-opacity=".025"/><stop offset="1" stop-color="#FF6B35" stop-opacity=".09"/></linearGradient>
<radialGradient id="core"><stop stop-color="#FF9F43" stop-opacity=".9"/><stop offset=".25" stop-color="#FF6B35" stop-opacity=".35"/><stop offset="1" stop-color="#FF6B35" stop-opacity="0"/></radialGradient>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#8994A3" stroke-opacity=".08"/></pattern>
<style>
.orbit{transform-box:fill-box;transform-origin:center;animation:spin 32s linear infinite}
.orbit2{transform-box:fill-box;transform-origin:center;animation:spinR 44s linear infinite}
.pulse{animation:pulse 4.8s ease-in-out infinite}
.signal{stroke-dasharray:10 18;animation:flow 14s linear infinite}
.float{animation:float 9s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}} @keyframes spinR{to{transform:rotate(-360deg)}}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-280}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@media (prefers-reduced-motion:reduce){.orbit,.orbit2,.pulse,.signal,.float{animation:none!important}}
</style>

</defs>

<rect width="1600" height="650" rx="24" fill="url(#bg)"/>
<rect width="1600" height="650" rx="24" fill="url(#grid)"/>
<path d="M0 525 C300 455 470 590 760 500 S1220 430 1600 525" fill="none" stroke="#FF6B35" stroke-opacity=".08" stroke-width="1"/>
<g opacity=".75"><path class="signal" d="M560 300 L620 220" fill="none" stroke="#FF6B35" stroke-opacity=".34" stroke-width="1"/><path class="signal" d="M620 220 L690 175" fill="none" stroke="#FF6B35" stroke-opacity=".34" stroke-width="1"/><path class="signal" d="M690 175 L910 190" fill="none" stroke="#FF6B35" stroke-opacity=".34" stroke-width="1"/><path class="signal" d="M910 190 L1000 250" fill="none" stroke="#FF6B35" stroke-opacity=".34" stroke-width="1"/><path class="signal" d="M1000 250 L1040 350" fill="none" stroke="#FF6B35" stroke-opacity=".34" stroke-width="1"/><path class="signal" d="M1040 350 L950 430" fill="none" stroke="#FF6B35" stroke-opacity=".34" stroke-width="1"/><path class="signal" d="M950 430 L850 475" fill="none" stroke="#FF6B35" stroke-opacity=".34" stroke-width="1"/><path class="signal" d="M850 475 L700 455" fill="none" stroke="#FF6B35" stroke-opacity=".34" stroke-width="1"/><path class="signal" d="M700 455 L600 390" fill="none" stroke="#FF6B35" stroke-opacity=".34" stroke-width="1"/><path class="signal" d="M600 390 L560 300" fill="none" stroke="#FF6B35" stroke-opacity=".34" stroke-width="1"/><path class="signal" d="M620 220 L600 390" fill="none" stroke="#FF6B35" stroke-opacity=".34" stroke-width="1"/><path class="signal" d="M690 175 L700 455" fill="none" stroke="#FF6B35" stroke-opacity=".34" stroke-width="1"/><path class="signal" d="M910 190 L850 475" fill="none" stroke="#FF6B35" stroke-opacity=".34" stroke-width="1"/><path class="signal" d="M1000 250 L950 430" fill="none" stroke="#FF6B35" stroke-opacity=".34" stroke-width="1"/></g>
<g class="float"><ellipse class="orbit" cx="800" cy="325" rx="250" ry="115" transform="rotate(12 800 325)" fill="none" stroke="#FF6B35" stroke-opacity="0.62" stroke-width="2" /><ellipse class="orbit2" cx="800" cy="325" rx="290" ry="92" transform="rotate(-28 800 325)" fill="none" stroke="#FF6B35" stroke-opacity="0.28" stroke-width="1.2" stroke-dasharray="7 10"/><ellipse class="orbit" cx="800" cy="325" rx="210" ry="145" transform="rotate(58 800 325)" fill="none" stroke="#FF6B35" stroke-opacity="0.28" stroke-width="1.2" stroke-dasharray="2 9"/></g>
<circle cx="800" cy="325" r="175" fill="url(#core)" filter="url(#soft)" opacity=".5"/>
<polygon points="800,180 930,250 955,390 800,485 645,390 670,250" fill="url(#glass)" stroke="#F5F7FA" stroke-opacity=".16"/>
<polygon points="800,215 900,272 920,375 800,435 680,375 700,272" fill="none" stroke="#FF6B35" stroke-opacity=".55" stroke-width="1.4"/>
<g stroke="#F5F7FA" stroke-opacity=".32" stroke-width="1"><path d="M800 180V485"/><path d="M645 390L955 250"/><path d="M670 250L930 390"/></g>
<circle cx="800" cy="325" r="58" fill="#080B10" stroke="#FF6B35" stroke-width="2"/>
<circle cx="800" cy="325" r="45" fill="url(#core)"/>
<g fill="#F5F7FA" opacity=".9"><circle cx="775" cy="305" r="2"/><circle cx="820" cy="296" r="2"/><circle cx="830" cy="335" r="2"/><circle cx="785" cy="350" r="2"/><circle cx="802" cy="322" r="2"/></g>
<g class="pulse" style="animation-delay:0.0s"><circle cx="560" cy="300" r="3.2" fill="#FF9F43"/><circle cx="560" cy="300" r="11" fill="#FF6B35" opacity=".12"/></g><g class="pulse" style="animation-delay:0.31s"><circle cx="620" cy="220" r="3.2" fill="#FF9F43"/><circle cx="620" cy="220" r="11" fill="#FF6B35" opacity=".12"/></g><g class="pulse" style="animation-delay:0.62s"><circle cx="690" cy="175" r="3.2" fill="#FF9F43"/><circle cx="690" cy="175" r="11" fill="#FF6B35" opacity=".12"/></g><g class="pulse" style="animation-delay:0.9299999999999999s"><circle cx="910" cy="190" r="3.2" fill="#FF9F43"/><circle cx="910" cy="190" r="11" fill="#FF6B35" opacity=".12"/></g><g class="pulse" style="animation-delay:1.24s"><circle cx="1000" cy="250" r="3.2" fill="#FF9F43"/><circle cx="1000" cy="250" r="11" fill="#FF6B35" opacity=".12"/></g><g class="pulse" style="animation-delay:1.55s"><circle cx="1040" cy="350" r="3.2" fill="#FF9F43"/><circle cx="1040" cy="350" r="11" fill="#FF6B35" opacity=".12"/></g><g class="pulse" style="animation-delay:1.8599999999999999s"><circle cx="950" cy="430" r="3.2" fill="#FF9F43"/><circle cx="950" cy="430" r="11" fill="#FF6B35" opacity=".12"/></g><g class="pulse" style="animation-delay:2.17s"><circle cx="850" cy="475" r="3.2" fill="#FF9F43"/><circle cx="850" cy="475" r="11" fill="#FF6B35" opacity=".12"/></g><g class="pulse" style="animation-delay:2.48s"><circle cx="700" cy="455" r="3.2" fill="#FF9F43"/><circle cx="700" cy="455" r="11" fill="#FF6B35" opacity=".12"/></g><g class="pulse" style="animation-delay:2.79s"><circle cx="600" cy="390" r="3.2" fill="#FF9F43"/><circle cx="600" cy="390" r="11" fill="#FF6B35" opacity=".12"/></g>
<g fill="#8994A3" font-family="ui-monospace,monospace" font-size="10" letter-spacing="1.5">
<text x="86" y="88">NEXUS / FINANCIAL INTELLIGENCE</text><text x="86" y="108" opacity=".65">BANKING · CAPITAL · SYSTEMS · EMERGING TECHNOLOGY</text>
<text x="1270" y="570">01 / 10</text><text x="1270" y="588" opacity=".6">SYSTEM MAP</text>
</g>
<path d="M80 570H300" stroke="#FF6B35" stroke-width="2"/><text x="80" y="600" fill="#F5F7FA" font-family="system-ui,sans-serif" font-size="24" font-weight="700">Saeed Varvaee</text>

</svg>
